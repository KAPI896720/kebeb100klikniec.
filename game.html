<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kebeb100klikniec</title>
<style>
  :root {
    --bg1: #ffb347;
    --bg2: #ff7e29;
    --card-bg: rgba(255,255,255,0.92);
    --text: #3a1f00;
    --accent: #d84315;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card-bg: rgba(30,20,10,0.9);
      --text: #ffe0b2;
    }
  }
  :root[data-theme="dark"] {
    --card-bg: rgba(30,20,10,0.9);
    --text: #ffe0b2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    user-select: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }
  #counter {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: bold;
    background: var(--card-bg);
    padding: 10px 30px;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    min-width: 160px;
    text-align: center;
  }
  #progressWrap {
    width: min(400px, 80vw);
    height: 16px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s ease-out;
  }
  #kebabBtn {
    font-size: clamp(6rem, 25vw, 10rem);
    background: none;
    border: none;
    cursor: pointer;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
    transition: transform 0.08s ease-out;
    line-height: 1;
    touch-action: manipulation;
  }
  #kebabBtn:active { transform: scale(0.88) rotate(-6deg); }
  .pop {
    position: absolute;
    pointer-events: none;
    font-weight: bold;
    font-size: 1.3rem;
    color: var(--accent);
    animation: floatUp 0.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
  }
  #hint {
    font-size: 0.95rem;
    opacity: 0.85;
    text-align: center;
  }

  /* Minigame overlay */
  #minigame {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #4a2600, #1c0f00);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 50;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    color: #ffe0b2;
    overflow: hidden;
  }
  #minigame.active { display: flex; }
  #mgHeader {
    text-align: center;
    margin-bottom: 10px;
  }
  #mgHeader h2 { margin: 0 0 6px 0; font-size: 1.6rem; }
  #mgStats { display: flex; gap: 20px; font-size: 1.1rem; font-weight: bold; }
  #mgField {
    position: relative;
    width: min(600px, 94vw);
    height: min(420px, 55vh);
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    margin-top: 10px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.15);
  }
  .hole {
    position: absolute;
    width: 70px;
    height: 70px;
    font-size: 3rem;
    background: none;
    border: none;
    cursor: pointer;
    transform: scale(0);
    transition: transform 0.15s ease-out;
    touch-action: manipulation;
  }
  .hole.show { transform: scale(1); }
  #mgResult {
    display: none;
    text-align: center;
    margin-top: 16px;
  }
  #mgResult.show { display: block; }
  #mgResult h2 { font-size: 2rem; margin: 0 0 8px 0; }
  button.action {
    margin-top: 12px;
    font-size: 1.1rem;
    padding: 10px 24px;
    border: none;
    border-radius: 12px;
    background: var(--accent, #d84315);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  button.action:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="app">
  <h1>🥙 kebeb100klikniec</h1>
  <div id="counter">0</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <button id="kebabBtn" aria-label="Kliknij kebaba">🥙</button>
  <div id="hint">Kliknij kebaba 100 razy, żeby odblokować minigrę!</div>
</div>

<div id="minigame">
  <div id="mgHeader">
    <h2>🥙 Łap kebaby!</h2>
    <div id="mgStats">
      <div>Wynik: <span id="mgScore">0</span></div>
      <div>Czas: <span id="mgTime">15</span>s</div>
    </div>
  </div>
  <div id="mgField"></div>
  <div id="mgResult">
    <h2 id="mgResultText"></h2>
    <button class="action" id="mgRestart">Zagraj jeszcze raz</button>
    <button class="action" id="mgClose" style="background:#555;">Wróć do klikania</button>
  </div>
</div>

<script>
(function(){
  let clicks = 0;
  const GOAL = 100;
  const counterEl = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');
  const kebabBtn = document.getElementById('kebabBtn');
  const hint = document.getElementById('hint');
  const app = document.getElementById('app');
  const minigame = document.getElementById('minigame');

  let unlocked = false;

  function updateUI() {
    counterEl.textContent = clicks;
    const pct = Math.min(100, (clicks / GOAL) * 100);
    progressBar.style.width = pct + '%';
    if (clicks >= GOAL && !unlocked) {
      unlocked = true;
      setTimeout(startMinigame, 400);
    } else if (!unlocked) {
      hint.textContent = `Kliknij kebaba jeszcze ${GOAL - clicks} razy!`;
    }
  }

  function spawnPop(x, y, text) {
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  }

  kebabBtn.addEventListener('click', (e) => {
    if (unlocked) return;
    clicks++;
    const rect = kebabBtn.getBoundingClientRect();
    spawnPop(rect.left + rect.width/2 - 10, rect.top, '+1');
    updateUI();
  });

  // ---- Minigame ----
  const mgField = document.getElementById('mgField');
  const mgScoreEl = document.getElementById('mgScore');
  const mgTimeEl = document.getElementById('mgTime');
  const mgResult = document.getElementById('mgResult');
  const mgResultText = document.getElementById('mgResultText');

  let mgScore = 0;
  let mgTimeLeft = 15;
  let mgTimerId = null;
  let mgSpawnId = null;
  let mgActiveHoles = [];
  const EMOJIS = ['🥙','🌯'];

  function startMinigame() {
    app.style.display = 'none';
    minigame.classList.add('active');
    mgResult.classList.remove('show');
    mgField.innerHTML = '';
    mgScore = 0;
    mgTimeLeft = 15;
    mgScoreEl.textContent = '0';
    mgTimeEl.textContent = '15';

    mgTimerId = setInterval(() => {
      mgTimeLeft--;
      mgTimeEl.textContent = mgTimeLeft;
      if (mgTimeLeft <= 0) endMinigame();
    }, 1000);

    spawnLoop();
  }

  function spawnLoop() {
    if (mgTimeLeft <= 0) return;
    const hole = document.createElement('button');
    hole.className = 'hole';
    hole.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    const fieldRect = mgField.getBoundingClientRect();
    const maxX = Math.max(10, fieldRect.width - 80);
    const maxY = Math.max(10, fieldRect.height - 80);
    hole.style.left = Math.random() * maxX + 'px';
    hole.style.top = Math.random() * maxY + 'px';

    mgField.appendChild(hole);
    requestAnimationFrame(() => hole.classList.add('show'));

    let clicked = false;
    hole.addEventListener('click', () => {
      if (clicked) return;
      clicked = true;
      mgScore++;
      mgScoreEl.textContent = mgScore;
      hole.classList.remove('show');
      setTimeout(() => hole.remove(), 150);
    });

    const lifetime = 600 + Math.random() * 500;
    setTimeout(() => {
      if (!clicked) {
        hole.classList.remove('show');
        setTimeout(() => hole.remove(), 150);
      }
    }, lifetime);

    const nextDelay = 350 + Math.random() * 350;
    mgSpawnId = setTimeout(spawnLoop, nextDelay);
  }

  function endMinigame() {
    clearInterval(mgTimerId);
    clearTimeout(mgSpawnId);
    mgField.innerHTML = '';
    let msg;
    if (mgScore >= 25) msg = `🏆 Mistrz kebaba! Wynik: ${mgScore}`;
    else if (mgScore >= 15) msg = `🥙 Niezły wynik: ${mgScore}!`;
    else msg = `Wynik: ${mgScore}. Spróbuj jeszcze raz!`;
    mgResultText.textContent = msg;
    mgResult.classList.add('show');
  }

  document.getElementById('mgRestart').addEventListener('click', startMinigame);
  document.getElementById('mgClose').addEventListener('click', () => {
    clearInterval(mgTimerId);
    clearTimeout(mgSpawnId);
    minigame.classList.remove('active');
    app.style.display = 'flex';
    clicks = 0;
    unlocked = false;
    hint.textContent = `Kliknij kebaba 100 razy, żeby znowu zagrać w minigrę!`;
    updateUI();
  });

  updateUI();
})();
</script>

</body>
</html>
